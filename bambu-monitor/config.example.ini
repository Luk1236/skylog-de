# Vorlage: kopieren nach config.ini und ausfüllen.
#   cp config.example.ini config.ini

[drucker]
# IP-Adresse des Druckers im Heimnetz.
# Am Drucker: Einstellungen > Netzwerk (WLAN/LAN). Am besten im Router fest vergeben.
ip = 192.168.178.50
# Seriennummer: Einstellungen > Gerät (oder Bambu Studio > Gerät). Großbuchstaben, ohne Leerzeichen.
seriennummer = 0948XXXXXXXXXXX
# Zugangscode (8 Zeichen): Einstellungen > Netzwerk > LAN-Modus / Zugangscode.
zugangscode = 12345678

[monitor]
# Alle wie viel Prozent eine Fortschrittsmeldung kommt.
fortschritt_schritt = 10
# Alle wie viel Sekunden während eines Drucks eine Statuszeile ins Log geht (0 = aus).
statusmeldung_sekunden = 60
# Aktueller Zustand als JSON-Datei (für eigene Skripte). Leer lassen = keine Datei.
status_datei = status.json
# Zusätzlich in eine Datei loggen (wird bei 1 MB rotiert). Leer = nur Bildschirm/journal.
log_datei =

[melden]
# Push aufs Handy über ntfy (kostenlose App „ntfy“, Thema dort abonnieren).
# Das Thema ist wie ein Passwort: etwas Langes, Zufälliges wählen. Leer = kein Push.
ntfy_thema =
ntfy_server = https://ntfy.sh
# Welche Ereignisse als Push kommen. Möglich:
#   start, fortschritt, fortgesetzt, pausiert, fertig, fehlgeschlagen, abgebrochen,
#   fehler, fehler_behoben, hms, hms_behoben, verbindung, status
ereignisse = start, fertig, fehlgeschlagen, abgebrochen, pausiert, fehler, hms, verbindung
# Optional: Befehl, der bei JEDEM Ereignis läuft. Er bekommt die Umgebungsvariablen
# BAMBU_EREIGNIS (z. B. "fertig"), BAMBU_TITEL, BAMBU_NACHRICHT und BAMBU_STATUS (JSON).
# Beispiel: befehl = /home/pi/bambu-monitor/beispiel_ereignis.sh
befehl =
