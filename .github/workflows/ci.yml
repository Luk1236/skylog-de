name: CI

# Qualitäts-Gate: hält die grüne Basis grün. Läuft bei jedem Push auf
# main/master und bei Pull Requests dorthin. Fängt genau die Fehlerklassen,
# die tsc allein nicht sieht (z. B. der Profil-Crash durch ein nicht
# importiertes Icon) — über ESLint und die View-Smoke-Tests.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps: ESLint 9 und einige Plugins haben (noch) leicht
      # abweichende Peer-Ranges; die Auflösung ist unkritisch für Dev-Tools.
      - run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  # Oberflächentests im echten Browser: Kernabläufe + Kontrast-Wächter
  # (hell/dunkel, alle Hauptansichten und wichtigen Dialoge).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:app
      - run: npx playwright test
      - name: Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

