name: Deploy to GitHub Pages

# Nur noch manuell. Die App wird als APK ausgeliefert, GitHub Pages ist im Repo
# nicht aktiviert — bei jedem Push lief der Deploy-Schritt daher rot ins Leere.
# Wer Pages doch nutzen will: in den Repo-Einstellungen aktivieren und diesen
# Workflow unter „Actions" von Hand starten.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          DEPLOY_TARGET: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
