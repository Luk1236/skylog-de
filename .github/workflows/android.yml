name: Android APK bauen

# Baut die Android-App in der Cloud. Damit ist kein JDK auf dem eigenen
# Rechner noetig - die fertige APK liegt danach als Artefakt zum Download
# bereit und kann direkt aufs Handy uebertragen werden.
on:
  push:
    branches: [main, master]
  # Erlaubt den Start von Hand fuer beliebige Branches (Actions-Tab -> Run workflow)
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle braucht ein JDK. 21 passt zu Capacitor 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Sicherheitsnetz: bricht der Build ab, wenn Tests rot sind, landet
      # keine kaputte APK auf dem Handy.
      - run: npm test

      # Bewusst KEIN Einbacken einer Offline-Karte in die APK: Die Regions-
      # Dateien liegen als GitHub-Release-Assets und werden in der App bei
      # Bedarf geladen (siehe src/services/mapRegions.ts). Das haelt die APK
      # klein und laesst die Wahl der Region beim Nutzer.
      # Erzeugt werden die Dateien mit: npx vite-node scripts/karten-bauen.ts

      # Bewusst build:app statt build - der Express-Server gehoert nicht
      # in die APK. DEPLOY_TARGET bleibt ungesetzt, damit die Basis-URL '/'
      # ist; mit '/skylog-de/' bliebe die App im WebView weiss.
      - run: npm run build:app

      - run: npx cap sync android

      - name: Gradle-Wrapper ausfuehrbar machen
        run: chmod +x android/gradlew

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: skylog-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
