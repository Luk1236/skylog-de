name: Android APK bauen

# Baut die Android-App in der Cloud. Damit ist kein JDK auf dem eigenen
# Rechner noetig - die fertige APK liegt danach als Artefakt zum Download
# bereit und kann direkt aufs Handy uebertragen werden.
on:
  push:
    branches: [main, master]
  # Erlaubt den Start von Hand fuer beliebige Branches (Actions-Tab -> Run workflow)
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # Volle Historie: die Versionsnummer ist die Zahl der Commits (siehe unten).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle braucht ein JDK. 21 passt zu Capacitor 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Standard waere "tools platform-tools" - das Paket "tools" gibt es mit den
      # cmdline-tools 16.0 auf dem Runner nicht mehr, sdkmanager bricht dann ab.
      # Plattform/Build-Tools laedt Gradle bei Bedarf selbst nach.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: npm ci

      # Sicherheitsnetz: bricht der Build ab, wenn Tests rot sind, landet
      # keine kaputte APK auf dem Handy.
      - run: npm test

      # Bewusst KEIN Einbacken einer Offline-Karte in die APK: Die Regions-
      # Dateien liegen als GitHub-Release-Assets und werden in der App bei
      # Bedarf geladen (siehe src/services/mapRegions.ts). Das haelt die APK
      # klein und laesst die Wahl der Region beim Nutzer.
      # Erzeugt werden die Dateien mit: npx vite-node scripts/karten-bauen.ts

      # Bewusst build:app statt build - der Express-Server gehoert nicht
      # in die APK. DEPLOY_TARGET bleibt ungesetzt, damit die Basis-URL '/'
      # ist; mit '/skylog-de/' bliebe die App im WebView weiss.
      # VITE_API_BASE: Server fuer den KI-Check in der APK (Vercel-Adresse).
      # Als Repo-Variable SKYLOG_API_URL hinterlegen; leer = KI-Check zeigt
      # in der APK einen Hinweis statt ins Leere zu laufen.
      - run: npm run build:app
        env:
          VITE_API_BASE: ${{ vars.SKYLOG_API_URL }}

      - run: npx cap sync android

      - name: Gradle-Wrapper ausfuehrbar machen
        run: chmod +x android/gradlew

      # Fester Signaturschluessel aus den Secrets, damit jede neue APK sich
      # ueber die installierte App aktualisieren laesst (gleiche Signatur).
      - name: Signaturschluessel bereitlegen
        env:
          KEYSTORE_B64: ${{ secrets.SKYLOG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret SKYLOG_KEYSTORE_BASE64 fehlt - ohne festen Schluessel liessen sich APKs nicht aktualisieren."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/skylog.p12"
          echo "SKYLOG_KEYSTORE_FILE=$RUNNER_TEMP/skylog.p12" >> "$GITHUB_ENV"
          # versionCode = Zahl der Commits: steigt mit jedem Commit und ist fuer
          # Test-APKs und Releases gleich - so laesst sich jede neuere APK ueber
          # jede aeltere installieren (Android verlangt einen steigenden versionCode).
          echo "SKYLOG_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          # versionName = Version aus package.json plus Build-Nummer, z. B. 1.3.0-build312.
          # So heißt auch eine Test-APK vor dem Tag schon wie die kommende Version.
          VERSION=$(node -p "require('./package.json').version")
          echo "SKYLOG_VERSION_NAME=${VERSION}-build$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Debug-APK bauen
        working-directory: android
        env:
          SKYLOG_KEYSTORE_PASSWORD: ${{ secrets.SKYLOG_KEYSTORE_PASSWORD }}
          SKYLOG_KEY_ALIAS: ${{ secrets.SKYLOG_KEY_ALIAS }}
        run: ./gradlew assembleDebug --no-daemon

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: skylog-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
